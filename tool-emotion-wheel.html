<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindbloom — Gefühle benennen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F8F7F4; --white: #FFFFFF;
  --border: rgba(0,0,0,.08); --border-m: rgba(0,0,0,.13);
  --text: #1A1A1A; --muted: #6B6B6B; --faint: #ABABAB;
  --g-sage:  linear-gradient(135deg,#C8D8C0,#8FAF88);
  --g-dusk:  linear-gradient(135deg,#C4C0DC,#8A84B8);
  --g-blush: linear-gradient(135deg,#DEC9C4,#BF9690);
  --g-slate: linear-gradient(135deg,#B8CCDA,#7A9DB5);
  --g-amber: linear-gradient(135deg,#DDD0B0,#BCA870);
  --g-rose:  linear-gradient(135deg,#E8C4C0,#C89490);
  --sage:#5A8050; --dusk:#6A64A0; --blush:#9A6A64;
  --serif:'EB Garamond', Georgia, serif,Georgia,serif;
  --lora:'EB Garamond', Georgia, serif,Georgia,serif;
  --sans:'Inter', sans-serif;
  --r:16px;
}
html,body { height:100%; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); font-weight:300; font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; }
a { text-decoration:none; color:inherit; }
button { cursor:pointer; font-family:var(--sans); border:none; background:none; }

/* NAV */

/* PAGE */
.page { flex:1; max-width:700px; margin:0 auto; width:100%; padding:2.5rem 1.5rem 5rem; }

/* HERO */
.hero { margin-bottom:2.5rem; }
.hero-tag { font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:.5rem; }
.hero h1 { font-family:var(--serif); font-size:2rem; font-weight:400; line-height:1.2; margin-bottom:.6rem; }
.hero p { color:var(--muted); font-size:14.5px; max-width:480px; }

/* PHASE INDICATOR */
.phase-bar { display:flex; gap:6px; margin-bottom:2rem; }
.phase-dot { width:6px; height:6px; border-radius:50%; background:var(--border-m); transition:background .3s; }
.phase-dot.active { background:var(--text); }

/* LAYER CARDS */
.layer-card { background:var(--white); border:1px solid var(--border); border-radius:20px; padding:1.6rem 1.8rem; margin-bottom:1rem; }
.layer-label { font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-bottom:1rem; }
.layer-title { font-family:var(--serif); font-size:1.25rem; font-weight:400; margin-bottom:.4rem; }
.layer-sub { font-size:13.5px; color:var(--muted); margin-bottom:1.2rem; line-height:1.6; }

/* CORE EMOTIONS — big pills */
.core-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem; }
.core-pill {
  border:1px solid var(--border-m); border-radius:14px; padding:1rem .8rem;
  text-align:center; background:var(--bg);
  transition:transform .15s, box-shadow .15s, border-color .15s;
  cursor:pointer;
}
.core-pill:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.08); }
.core-pill.selected { border-color:transparent; box-shadow:0 4px 18px rgba(0,0,0,.12); }
.core-orb { width:36px; height:36px; border-radius:50%; margin:0 auto .5rem; }
.core-name { font-size:13px; font-weight:500; display:block; margin-bottom:.15rem; }
.core-hint { font-size:11px; color:var(--faint); }

/* SECONDARY CHIPS */
.secondary-grid { display:flex; flex-wrap:wrap; gap:.5rem; }
.sec-chip {
  padding:7px 14px; border-radius:100px; border:1px solid var(--border-m);
  font-size:13px; background:var(--bg); color:var(--muted);
  transition:background .15s, border-color .15s, color .15s, transform .1s;
  cursor:pointer;
}
.sec-chip:hover { color:var(--text); border-color:rgba(0,0,0,.25); transform:translateY(-1px); }
.sec-chip.selected { color:var(--text); border-color:transparent; background:var(--white); box-shadow:0 2px 10px rgba(0,0,0,.1); }

/* NUANCE CHIPS */
.nuance-grid { display:flex; flex-wrap:wrap; gap:.5rem; }
.nua-chip {
  padding:6px 13px; border-radius:100px; border:1.5px solid var(--border);
  font-size:12.5px; font-family:var(--lora); font-style:italic;
  background:var(--white); color:var(--muted);
  transition:all .15s; cursor:pointer;
}
.nua-chip:hover { color:var(--text); transform:translateY(-1px); }
.nua-chip.selected { color:var(--text); border-color:transparent; box-shadow:0 3px 12px rgba(0,0,0,.1); }

/* RESULT CARD */
.result-card { background:var(--white); border:1px solid var(--border); border-radius:20px; padding:2rem; margin-bottom:1rem; animation:fadeUp .4s ease; }
.result-feeling-display { display:flex; align-items:center; gap:1rem; margin-bottom:1.4rem; }
.result-orb { width:52px; height:52px; border-radius:50%; flex-shrink:0; }
.result-words { }
.result-label { font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-bottom:.2rem; }
.result-name { font-family:var(--serif); font-size:1.5rem; font-weight:400; }
.result-body { font-size:14px; color:var(--muted); line-height:1.75; margin-bottom:1.4rem; border-top:1px solid var(--border); padding-top:1.2rem; }
.result-tip { background:var(--bg); border-radius:12px; padding:1rem 1.2rem; font-size:13.5px; color:var(--text); line-height:1.65; margin-bottom:1.4rem; }
.result-tip strong { font-weight:500; font-family:var(--lora); }

/* BREADCRUMB trail */
.trail { display:flex; align-items:center; gap:.4rem; font-size:12px; color:var(--faint); margin-bottom:1.6rem; flex-wrap:wrap; }
.trail-item { color:var(--muted); }
.trail-sep { font-size:10px; }
.trail-item.dim { color:var(--faint); }

/* BUTTONS */
.btn-continue { display:inline-flex; align-items:center; gap:.5rem; background:var(--text); color:var(--white); border:none; border-radius:100px; padding:11px 22px; font-size:13px; font-weight:500; letter-spacing:.04em; font-family:var(--sans); cursor:pointer; transition:opacity .18s, transform .1s; }
.btn-continue:hover { opacity:.85; transform:translateY(-1px); }
.btn-continue:disabled { opacity:.3; cursor:not-allowed; transform:none; }
.btn-secondary { display:inline-flex; align-items:center; gap:.4rem; color:var(--muted); border:1px solid var(--border-m); border-radius:100px; padding:10px 18px; font-size:12.5px; font-family:var(--sans); cursor:pointer; transition:color .18s, border-color .18s; background:none; }
.btn-secondary:hover { color:var(--text); border-color:var(--text); }
.step-footer { display:flex; align-items:center; justify-content:space-between; margin-top:1.4rem; padding-top:1.2rem; border-top:1px solid var(--border); }
.result-actions { display:flex; gap:.7rem; flex-wrap:wrap; }

@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.anim { animation:fadeUp .35s ease forwards; }

@media(max-width:520px) {
  .core-grid { grid-template-columns:repeat(2,1fr); }
  .hero h1 { font-size:1.6rem; }
  .page { padding:1.8rem 1rem 4rem; }
}
</style>
  <script src="nav.js?v=6"></script>
  <link rel="stylesheet" href="shared.css">
  <script src="theme.js?v=1"></script>
</head>
<body>
  <div id="site-nav-placeholder"></div>
  

<div class="page">
  <div class="hero">
    <div class="hero-tag">Emotionen · Selbstwahrnehmung</div>
    <h1>Gefühle benennen</h1>
    <p>Du weißt, dass etwas in dir vorgeht — aber nicht genau was. Hier kannst du Schritt für Schritt herausfinden, was du gerade wirklich fühlst.</p>
  </div>

  <div class="phase-bar" id="phaseDots">
    <div class="phase-dot active" id="dot0"></div>
    <div class="phase-dot" id="dot1"></div>
    <div class="phase-dot" id="dot2"></div>
    <div class="phase-dot" id="dot3"></div>
  </div>

  <div id="toolContent"></div>
</div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────
const EMOTIONS = [
  {
    id:'sad', name:'Traurig', hint:'schwer, leer, niedergeschlagen',
    grad:'linear-gradient(135deg,#B8CCDA,#7A9DB5)', tint:'#EAF0F4', text:'#4A7A95',
    secondary:[
      { name:'Einsam',     nuances:['verlassen','ausgegrenzt','unverstanden','isoliert','unsichtbar'] },
      { name:'Hoffnungslos',nuances:['erschöpft','aufgegeben','festgefahren','kraftlos','resigniert'] },
      { name:'Schmerz',    nuances:['gebrochen','verletzt','betrauert','untröstlich','betäubt'] },
      { name:'Sehnsucht',  nuances:['vermissend','wehmütig','nosalgisch','sehnsüchtig','traurig-schön'] },
      { name:'Enttäuscht', nuances:['ernüchtert','desillusioniert','im Stich gelassen','bitter','niedergeschlagen'] },
    ],
    desc:'Traurigkeit ist eine echte, wichtige Emotion. Sie signalisiert, dass dir etwas bedeutsam ist — und dass du es anerkennst.',
    tip:'<strong>Was helfen kann:</strong> Erlaube dir, traurig zu sein ohne es wegzumachen. Ein kleiner Schritt: Schreib auf, was du gerade vermisst oder betrauerst.'
  },
  {
    id:'angry', name:'Wütend', hint:'gereizt, ungerecht, heiß',
    grad:'linear-gradient(135deg,#E8C4B0,#C08060)', tint:'#FBF0EA', text:'#9A6040',
    secondary:[
      { name:'Frustration', nuances:['blockiert','hilflos','feststeckend','ohnmächtig','überwältigt'] },
      { name:'Verärgerung', nuances:['genervt','gereizt','angespannt','aufgewühlt','ungehalten'] },
      { name:'Empörung',    nuances:['ungerecht behandelt','ausgenutzt','betrogen','verletzt','missachtet'] },
      { name:'Eifersucht',  nuances:['neidisch','unsicher','bedroht','konkurrierend','minderwertig'] },
      { name:'Ungeduld',    nuances:['angespannt','drängerisch','überfordert','rastlos','ungeduldig'] },
    ],
    desc:'Wut zeigt, dass eine Grenze überschritten wurde oder dass dir etwas wichtig ist. Sie ist ein Signal — kein Fehler.',
    tip:'<strong>Was helfen kann:</strong> Bevor du reagierst: Benenne die Wut laut ("Ich bin gerade wütend, weil..."). Das allein kann Druck rausnehmen.'
  },
  {
    id:'scared', name:'Ängstlich', hint:'unruhig, bange, unsicher',
    grad:'linear-gradient(135deg,#C4C0DC,#8A84B8)', tint:'#EEEDF6', text:'#6A64A0',
    secondary:[
      { name:'Nervös',      nuances:['aufgeregt-bangend','zitternd','aufgewühlt','innerlich unruhig','kribbelig'] },
      { name:'Unsicher',    nuances:['zweifelnd','zögerlich','wankelmütig','orientierungslos','verloren'] },
      { name:'Überfordert', nuances:['zu viel','ausgeliefert','hilflos','erschlagen','atemlos'] },
      { name:'Sorge',       nuances:['grüblerisch','denkend im Kreis','vorauseilend','pessimistisch','anspannt'] },
      { name:'Panik',       nuances:['außer Kontrolle','herzrasend','wie eingefroren','nicht da','wie im Tunnel'] },
    ],
    desc:'Angst ist ein Schutzinstinkt. Sie sagt dir, dass etwas Aufmerksamkeit braucht — aber sie übertreibt manchmal.',
    tip:'<strong>Was helfen kann:</strong> Benenne konkret, wovor du Angst hast. "Ich habe Angst, dass..." macht diffuse Angst greifbarer und kleiner.'
  },
  {
    id:'joy', name:'Freudig', hint:'leicht, dankbar, lebendig',
    grad:'linear-gradient(135deg,#C8D8C0,#8FAF88)', tint:'#F0F4EE', text:'#5A8050',
    secondary:[
      { name:'Dankbar',     nuances:['gesegnet','berührt','geehrt','beschenkt','tief bewegt'] },
      { name:'Aufgeregt',   nuances:['voller Energie','enthusiastisch','gespannt','vorfreudig','lebendig'] },
      { name:'Zufrieden',   nuances:['in Frieden','geerdet','vollständig','ruhig-glücklich','satt'] },
      { name:'Stolz',       nuances:['erfüllt','selbstsicher','gewachsen','geschafft','stark'] },
      { name:'Verliebt',    nuances:['verbunden','geborgen','gesehen','warmherzig','hingezogen'] },
    ],
    desc:'Freude verdient genauso viel Aufmerksamkeit wie schwierige Gefühle. Benenne sie — das macht sie echter.',
    tip:'<strong>Was helfen kann:</strong> Halte diesen Moment fest. Schreib einen Satz, der festhält, was ihn ausgelöst hat — das Gehirn lernt durch Wiederholung, wo Freude entsteht.'
  },
  {
    id:'disgusted', name:'Abgelehnt', hint:'ausgegrenzt, beschämt, ungeliebt',
    grad:'linear-gradient(135deg,#DEC9C4,#BF9690)', tint:'#F9F2F0', text:'#9A6A64',
    secondary:[
      { name:'Scham',       nuances:['bloßgestellt','unwürdig','falsch','zu viel','nicht genug'] },
      { name:'Schuld',      nuances:['bereuernd','verantwortlich','vorwurfsvoll gegen mich','belasten','mitschuldig'] },
      { name:'Abweisung',   nuances:['zurückgewiesen','nicht gewollt','ignoriert','unwichtig','übersehen'] },
      { name:'Ekel',        nuances:['abgestoßen','angewidert','distanziert','sich fremd fühlend','unbehaglich'] },
      { name:'Selbstzweifel',nuances:['nicht gut genug','vergleichend','minderwertig','kritisch gegen mich','zweifelnd'] },
    ],
    desc:'Scham und Ablehnung sind besonders schwer zu benennen. Sie im Licht zu halten, macht sie kleiner.',
    tip:'<strong>Was helfen kann:</strong> Stell dir vor, ein guter Freund hätte das erlebt, was du gerade fühlst. Was würdest du ihm sagen?'
  },
  {
    id:'surprised', name:'Verwirrt', hint:'orientierungslos, numb, leer',
    grad:'linear-gradient(135deg,#DDD0B0,#BCA870)', tint:'#F8F4EA', text:'#907840',
    secondary:[
      { name:'Betäubt',     nuances:['emotionslos','wie hinter Glas','abgeschnitten','taub','nicht da'] },
      { name:'Überwältigt', nuances:['zu viel auf einmal','fassungslos','kann nicht verarbeiten','wie eingefroren','leer'] },
      { name:'Ambivalent',  nuances:['zerrissen','widersprüchlich','nicht sicher','hin und her gerissen','sowohl als auch'] },
      { name:'Erschöpft',   nuances:['ausgebrannt','leer','kraftlos','ausgezehrt','nichts mehr übrig'] },
      { name:'Distanziert', nuances:['beobachtend','nicht present','weggetreten','abgestumpft','stumpf'] },
    ],
    desc:'Manchmal fühlen wir gar nichts — und das ist auch ein Gefühl. Taubheit ist oft Erschöpfung oder Schutz.',
    tip:'<strong>Was helfen kann:</strong> Sei freundlich mit dir. Wenn du nichts fühlst, brauchst du vielleicht Pause, Schlaf oder einfach Zeit. Das ist in Ordnung.'
  },
];

// ── STATE ─────────────────────────────────────────────────────────────────
let phase = 0;
let selectedCore = null;
let selectedSecondary = null;
let selectedNuance = null;

// ── HELPERS ───────────────────────────────────────────────────────────────
function setPhase(p) {
  phase = p;
  [0,1,2,3].forEach(i => {
    document.getElementById('dot'+i).classList.toggle('active', i <= p);
  });
}

function render() {
  const c = document.getElementById('toolContent');
  c.innerHTML = '';
  if (phase === 0) renderCore(c);
  else if (phase === 1) renderSecondary(c);
  else if (phase === 2) renderNuance(c);
  else renderResult(c);
}

// ── PHASE 0: Core emotion ─────────────────────────────────────────────────
function renderCore(c) {
  const card = document.createElement('div');
  card.className = 'layer-card anim';
  card.innerHTML = `
    <div class="layer-label">Schritt 1 von 3</div>
    <div class="layer-title">Was spürst du gerade am ehesten?</div>
    <div class="layer-sub">Wähle das Gefühl, das am nächsten dran ist — auch wenn es nicht perfekt passt.</div>
    <div class="core-grid">
      ${EMOTIONS.map(e => `
        <button class="core-pill ${selectedCore?.id===e.id?'selected':''}" onclick="selectCore('${e.id}')" style="${selectedCore?.id===e.id?`background:${e.tint};border-color:${e.tint};`:''}">
          <div class="core-orb" style="background:${e.grad};"></div>
          <span class="core-name">${e.name}</span>
          <span class="core-hint">${e.hint}</span>
        </button>
      `).join('')}
    </div>
    <div class="step-footer">
      <span></span>
      <button class="btn-continue" onclick="goPhase(1)" ${selectedCore?'':'disabled'}>
        Genauer werden
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>`;
  c.appendChild(card);
}

function selectCore(id) {
  selectedCore = EMOTIONS.find(e=>e.id===id);
  selectedSecondary = null; selectedNuance = null;
  render();
}

// ── PHASE 1: Secondary ────────────────────────────────────────────────────
function renderSecondary(c) {
  const trail = document.createElement('div');
  trail.className = 'trail anim';
  trail.innerHTML = `<span class="trail-item">${selectedCore.name}</span><span class="trail-sep">›</span><span class="trail-item dim">?</span>`;
  c.appendChild(trail);

  const card = document.createElement('div');
  card.className = 'layer-card anim';
  card.innerHTML = `
    <div class="layer-label">Schritt 2 von 3</div>
    <div class="layer-title">Was trifft es noch genauer?</div>
    <div class="layer-sub">Alle diese Gefühle gehören zu "${selectedCore.name}" — welches liegt am nächsten?</div>
    <div class="secondary-grid">
      ${selectedCore.secondary.map(s => `
        <button class="sec-chip ${selectedSecondary?.name===s.name?'selected':''}" onclick="selectSecondary('${s.name}')"
          style="${selectedSecondary?.name===s.name?`background:${selectedCore.tint};border-color:${selectedCore.tint};`:''}"
        >${s.name}</button>
      `).join('')}
    </div>
    <div class="step-footer">
      <button class="btn-secondary" onclick="goPhase(0)">← Zurück</button>
      <button class="btn-continue" onclick="goPhase(2)" ${selectedSecondary?'':'disabled'}>
        Noch tiefer
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>`;
  c.appendChild(card);
}

function selectSecondary(name) {
  selectedSecondary = selectedCore.secondary.find(s=>s.name===name);
  selectedNuance = null;
  render();
}

// ── PHASE 2: Nuance ───────────────────────────────────────────────────────
function renderNuance(c) {
  const trail = document.createElement('div');
  trail.className = 'trail anim';
  trail.innerHTML = `<span class="trail-item">${selectedCore.name}</span><span class="trail-sep">›</span><span class="trail-item">${selectedSecondary.name}</span><span class="trail-sep">›</span><span class="trail-item dim">?</span>`;
  c.appendChild(trail);

  const card = document.createElement('div');
  card.className = 'layer-card anim';
  card.innerHTML = `
    <div class="layer-label">Schritt 3 von 3</div>
    <div class="layer-title">Welches Wort trifft es am besten?</div>
    <div class="layer-sub">Manchmal macht ein einziges Wort den Unterschied. Wähle das, das am ehesten resoniert.</div>
    <div class="nuance-grid">
      ${selectedSecondary.nuances.map(n => `
        <button class="nua-chip ${selectedNuance===n?'selected':''}" onclick="selectNuance('${n}')"
          style="${selectedNuance===n?`border-color:${selectedCore.tint};box-shadow:0 2px 10px rgba(0,0,0,.08);`:''}"
        >${n}</button>
      `).join('')}
    </div>
    <div class="step-footer">
      <button class="btn-secondary" onclick="goPhase(1)">← Zurück</button>
      <button class="btn-continue" onclick="goPhase(3)" ${selectedNuance?'':'disabled'}>
        Mein Gefühl zeigen
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>`;
  c.appendChild(card);
}

function selectNuance(n) {
  selectedNuance = n;
  render();
}

// ── PHASE 3: Result ───────────────────────────────────────────────────────
function renderResult(c) {
  const trail = document.createElement('div');
  trail.className = 'trail anim';
  trail.innerHTML = `<span class="trail-item">${selectedCore.name}</span><span class="trail-sep">›</span><span class="trail-item">${selectedSecondary.name}</span><span class="trail-sep">›</span><span class="trail-item">${selectedNuance}</span>`;
  c.appendChild(trail);

  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `
    <div class="result-feeling-display">
      <div class="result-orb" style="background:${selectedCore.grad};"></div>
      <div class="result-words">
        <div class="result-label">Du fühlst dich gerade</div>
        <div class="result-name" style="color:${selectedCore.text};">${selectedNuance}</div>
      </div>
    </div>
    <div class="result-body">${selectedCore.desc}</div>
    <div class="result-tip">${selectedCore.tip}</div>
    <div class="result-actions">
      <button class="btn-continue" onclick="restart()">
        Nochmal
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      </button>
      <a href="tools.html" class="btn-secondary">← Alle Tools</a>
    </div>`;
  c.appendChild(card);
}

// ── NAVIGATION ────────────────────────────────────────────────────────────
function goPhase(p) { setPhase(p); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function restart() { selectedCore=null; selectedSecondary=null; selectedNuance=null; goPhase(0); }

// INIT
render();
</script>
</body>
</html>
