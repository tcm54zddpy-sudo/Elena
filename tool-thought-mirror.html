<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindbloom — Thought Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#F8F7F4; --white:#FFFFFF;
  --border:rgba(0,0,0,.08); --border-m:rgba(0,0,0,.13);
  --text:#1A1A1A; --muted:#6B6B6B; --faint:#ABABAB;
  --g-sage:linear-gradient(135deg,#C8D8C0,#8FAF88);
  --g-dusk:linear-gradient(135deg,#C4C0DC,#8A84B8);
  --g-blush:linear-gradient(135deg,#DEC9C4,#BF9690);
  --g-amber:linear-gradient(135deg,#DDD0B0,#BCA870);
  --sage-tint:#F0F4EE; --dusk-tint:#EEEDF6; --blush-tint:#F9F2F0;
  --sage:#5A8050; --dusk:#6A64A0;
  --serif:'EB Garamond', Georgia, serif,Georgia,serif;
  --lora:'EB Garamond', Georgia, serif,Georgia,serif;
  --sans:'Inter', sans-serif;
  --r:20px;
}
html { min-height:100%; }
body { min-height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); font-weight:300; font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
a { text-decoration:none; color:inherit; }
button { cursor:pointer; font-family:var(--sans); border:none; }
textarea, input { font-family:var(--sans); }

/* NAV */

/* PROGRESS */
.progress-bar { height:2px; background:var(--border); position:sticky; top:60px; z-index:99; }
.progress-fill { height:100%; background:var(--text); transition:width .55s cubic-bezier(.4,0,.2,1); }

/* STAGE */
.stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:2.5rem 1.2rem 6rem; position:relative; }

/* CARD */
.step-card { width:100%; max-width:620px; }
.step-card.entering { animation:cardIn .42s cubic-bezier(.4,0,.2,1) forwards; }
.step-card.leaving  { animation:cardOut .28s cubic-bezier(.4,0,.2,1) forwards; pointer-events:none; position:absolute; }
@keyframes cardIn  { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }
@keyframes cardOut { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-18px)} }

/* STEP LABEL */
.step-label { font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.step-dot { width:20px; height:20px; border-radius:50%; background:var(--text); color:#fff; font-size:9px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }

/* QUESTION */
.step-q { font-family:var(--serif); font-size:clamp(19px,4vw,27px); font-weight:400; line-height:1.28; margin-bottom:8px; }
.step-sub { font-family:var(--lora); font-style:italic; font-size:13.5px; color:var(--muted); line-height:1.7; margin-bottom:1.5rem; }

/* ── THOUGHT DISPLAY ── (gets lighter each step) */
.thought-display {
  margin-bottom:1.3rem;
  transition:all .6s ease;
}
.thought-display .td-label { font-size:9.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-bottom:5px; }
.thought-display .td-text {
  font-family:var(--lora); font-style:italic;
  border-left:3px solid;
  padding:9px 14px;
  border-radius:0 var(--r) var(--r) 0;
  line-height:1.5;
  transition:all .5s ease;
}
/* step-specific weights */
.td-step1 .td-text { font-size:1.1rem; color:var(--text); border-color:rgba(191,150,144,.6); background:rgba(249,242,240,.7); }
.td-step2 .td-text { font-size:.95rem; color:var(--muted); border-color:rgba(191,150,144,.35); background:rgba(249,242,240,.4); }
.td-step3 .td-text, .td-step4 .td-text, .td-step5 .td-text { font-size:.875rem; color:var(--faint); border-color:rgba(191,150,144,.2); background:rgba(249,242,240,.25); }
.td-step6 .td-text, .td-step7 .td-text { font-size:.825rem; color:var(--faint); border-color:rgba(191,150,144,.12); background:transparent; opacity:.7; }
.td-interpretation-badge {
  display:inline-block; margin-top:5px;
  font-size:9.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase;
  color:rgba(191,150,144,.8); padding:2px 8px; border-radius:100px;
  border:1px solid rgba(191,150,144,.3);
}

/* ── INPUTS ── */
.big-textarea { width:100%; min-height:96px; border:1px solid var(--border-m); border-radius:var(--r); padding:14px 16px; font-family:var(--lora); font-size:15px; font-weight:400; color:var(--text); background:var(--white); outline:none; resize:none; line-height:1.75; caret-color:var(--dusk); transition:border-color .18s, box-shadow .18s; }
.big-textarea:focus { box-shadow:0 2px 16px rgba(0,0,0,.06); }
.big-textarea::placeholder { color:var(--faint); font-style:italic; }
.char-row { display:flex; justify-content:space-between; margin-top:5px; }
.char-count { font-size:11px; color:var(--faint); }
.simple-input { width:100%; border:1px solid var(--border-m); border-radius:var(--r); padding:12px 14px; font-family:var(--lora); font-style:italic; font-size:14px; color:var(--text); background:var(--white); outline:none; transition:border-color .18s, box-shadow .18s; }
.simple-input:focus { box-shadow:0 2px 12px rgba(0,0,0,.06); }
.simple-input::placeholder { color:var(--faint); }

/* ── SUGGESTION CHIPS ── */
.chips-label { font-size:10.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:.5rem; margin-top:1rem; }
.chips-wrap { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:.3rem; }
.chip { padding:6px 13px; border-radius:100px; border:1px solid var(--border); background:var(--bg); font-size:12.5px; font-family:var(--lora); font-style:italic; color:var(--muted); cursor:pointer; transition:all .15s; }
.chip:hover { border-color:var(--border-m); background:var(--white); color:var(--text); }
.chip.selected { background:var(--text); color:#fff; border-color:var(--text); font-style:normal; }

/* ── DEFUSION ANIMATION (Step 2) ── */
.defusion-container { margin-bottom:1.2rem; }

.defusion-thought {
  padding:14px 18px;
  border-radius:var(--r);
  background:var(--blush-tint);
  border:1px solid rgba(191,150,144,.3);
  font-family:var(--lora); font-style:italic;
  font-size:1.05rem; color:var(--text);
  line-height:1.5;
  margin-bottom:10px;
  position:relative;
  overflow:hidden;
}
.defusion-thought::before { content:'Gedanke'; position:absolute; top:8px; right:12px; font-size:9px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:rgba(191,150,144,.6); font-style:normal; font-family:var(--sans); }

.defusion-split {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:0; align-items:stretch;
  opacity:0;
  transform:translateY(12px);
  transition:opacity .6s ease, transform .6s ease;
}
.defusion-split.visible { opacity:1; transform:translateY(0); }
.defusion-event {
  border-radius:var(--r) 0 0 var(--r);
  border:1.5px solid rgba(90,128,80,.25);
  border-right:none;
  background:var(--sage-tint);
  padding:14px 16px;
  animation:slideFromLeft .5s .1s cubic-bezier(.4,0,.2,1) both;
}
.defusion-arrow {
  display:flex; align-items:center; justify-content:center;
  width:36px; background:var(--white); border-top:1.5px solid var(--border); border-bottom:1.5px solid var(--border);
  color:var(--faint); font-size:16px;
  animation:fadeIn .4s .4s ease both;
}
.defusion-interp {
  border-radius:0 var(--r) var(--r) 0;
  border:1.5px solid rgba(191,150,144,.3);
  border-left:none;
  background:var(--blush-tint);
  padding:14px 16px;
  animation:slideFromRight .5s .1s cubic-bezier(.4,0,.2,1) both;
}
.def-col-label { font-size:9.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:6px; }
.def-col-text { font-family:var(--lora); font-style:italic; font-size:13.5px; color:var(--text); line-height:1.5; }
.defusion-note {
  text-align:center; margin-top:8px;
  font-size:11.5px; color:var(--faint); font-family:var(--lora); font-style:italic;
  animation:fadeIn .5s .8s ease both;
  opacity:0;
}
.defusion-note.visible { opacity:1; }
@keyframes slideFromLeft  { from{opacity:0;transform:translateX(-16px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideFromRight { from{opacity:0;transform:translateX(16px)}  to{opacity:1;transform:translateX(0)} }
@keyframes fadeIn         { from{opacity:0} to{opacity:1} }

/* Alternative chips grid */
.alt-grid { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:.8rem; }
.alt-chip { padding:7px 14px; border-radius:100px; border:1px solid var(--border); background:var(--white); font-size:13px; color:var(--muted); cursor:pointer; transition:all .18s; }
.alt-chip:hover { border-color:var(--border-m); }
.alt-chip.selected { background:var(--text); color:#fff; border-color:var(--text); }

/* Friend test */
.friend-choices { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.friend-btn { padding:1rem; border-radius:var(--r); border:1.5px solid var(--border-m); background:var(--white); font-size:14px; color:var(--text); transition:all .18s; text-align:center; }
.friend-btn:hover { border-color:var(--border-m); box-shadow:0 2px 10px rgba(0,0,0,.07); }
.friend-btn.selected { background:var(--text); color:#fff; border-color:var(--text); }

/* ── COMPARISON ANIMATION (Step 7) ── */
.compare-stage { margin-bottom:1.4rem; }
.compare-self-full {
  border-radius:var(--r); padding:16px 18px;
  background:var(--blush-tint); border:1px solid rgba(191,150,144,.3);
  font-family:var(--lora); font-style:italic; font-size:1rem;
  color:var(--text); line-height:1.5; margin-bottom:10px;
  transition:all .6s cubic-bezier(.4,0,.2,1);
}
.compare-self-full .cs-label-sm { font-size:9.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:5px; font-style:normal; font-family:var(--sans); }
.compare-split {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  opacity:0; transform:translateY(10px);
  transition:opacity .5s ease, transform .5s ease;
}
.compare-split.visible { opacity:1; transform:translateY(0); }
.compare-col { border-radius:var(--r); padding:14px 16px; }
.compare-col.friend { background:var(--sage-tint); border:1px solid rgba(90,128,80,.2); }
.compare-col.self   { background:var(--blush-tint); border:1px solid rgba(191,150,144,.25); opacity:.7; }
.cc-label { font-size:9.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:6px; }
.cc-text { font-family:var(--lora); font-style:italic; font-size:13.5px; color:var(--text); line-height:1.55; }

/* Needs */
.needs-grid { display:flex; flex-wrap:wrap; gap:8px; }
.need-btn { padding:8px 16px; border-radius:100px; border:1px solid var(--border); background:var(--white); font-size:13px; color:var(--muted); cursor:pointer; transition:all .18s; display:flex; align-items:center; gap:6px; }
.need-btn:hover { border-color:var(--border-m); }
.need-btn.selected { background:var(--text); color:#fff; border-color:var(--text); }

/* ── CLOSING SUMMARY ── */
.closing-card { background:var(--white); border:1px solid var(--border); border-radius:var(--r); padding:1.6rem; margin-bottom:1.2rem; }
.closing-row { margin-bottom:1.1rem; }
.closing-row:last-child { margin-bottom:0; }
.cr-label { font-size:9.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-bottom:5px; }
.cr-text { font-family:var(--lora); font-style:italic; font-size:14px; color:var(--text); line-height:1.65; }
.cr-text.was { color:var(--faint); font-size:12.5px; position:relative; display:inline-block; }
.cr-text.was::after { content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.25); }
.cr-divider { height:1px; background:var(--border); margin:.8rem 0; }
.cr-text.highlighted { color:var(--sage); }

.takeaway-chips-wrap { display:flex; flex-wrap:wrap; gap:6px; margin-top:.8rem; }
.takeaway-chip { padding:6px 14px; border-radius:100px; border:1px solid var(--border); background:var(--bg); font-family:var(--lora); font-style:italic; font-size:12px; color:var(--muted); cursor:pointer; transition:all .15s; }
.takeaway-chip:hover { border-color:var(--border-m); color:var(--text); background:var(--white); }

/* FOOTER */
.step-footer { display:flex; align-items:center; justify-content:space-between; margin-top:1.5rem; gap:10px; }
.btn-back-step { font-size:12px; color:var(--faint); background:none; border:none; cursor:pointer; padding:0; display:flex; align-items:center; gap:4px; transition:color .18s; }
.btn-back-step:hover { color:var(--muted); }
.btn-continue { padding:.6rem 1.6rem; border-radius:100px; background:var(--text); color:#fff; font-size:13px; font-weight:500; border:none; display:flex; align-items:center; gap:6px; transition:opacity .18s; }
.btn-continue:hover { opacity:.8; }
.btn-continue:disabled { opacity:.3; cursor:not-allowed; }
.optional-tag { font-size:10.5px; color:var(--faint); margin-bottom:.4rem; }
.finish-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:1.4rem; }
.btn-primary { padding:.6rem 1.4rem; border-radius:100px; background:var(--text); color:#fff; font-size:13px; font-weight:500; border:none; transition:opacity .18s; }
.btn-primary:hover { opacity:.8; }
.btn-secondary { padding:.55rem 1.2rem; border-radius:100px; border:1px solid var(--border-m); background:none; font-size:13px; color:var(--muted); transition:color .18s,border-color .18s; }
.btn-secondary:hover { color:var(--text); border-color:var(--text); }

@media(max-width:480px) {
  .defusion-split { grid-template-columns:1fr; }
  .defusion-arrow { display:none; }
  .compare-split { grid-template-columns:1fr; }
  .friend-choices { grid-template-columns:1fr; }
}
</style>

</head>
<body>
  <div id="site-nav-placeholder"></div>
  
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="stage" id="stage"></div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────
const A = {
  thought:'', situation:'', conclusion:'',
  alternatives:[], altCustom:'',
  neutral:'', friendTest:'', friendSays:'', stricterReason:'',
  needs:[], takeaway:'',
};

// ── SUGGESTIONS ──────────────────────────────────────────────────────
const THOUGHT_EXAMPLES = [
  'Ich bin ein Versager.','Niemand mag mich wirklich.',
  'Ich bin nicht gut genug.','Ich mache immer alles falsch.',
  'Ich bin eine Belastung für andere.','Ich werde das nie schaffen.',
  'Ich bin anders als alle anderen.','Mit mir stimmt etwas nicht.',
  'Ich verdiene das Gute nicht.','Ich bin zu empfindlich.',
  'Ich werde immer allein sein.','Ich habe alles ruiniert.',
  'Ich bin schwach.','Ich enttäusche alle.',
];

const CONCLUSION_EXAMPLES = [
  'Wenn ich scheitere, bin ich wertlos.','Wenn jemand mich ablehnt, stimmt etwas nicht mit mir.',
  'Wenn ich Fehler mache, bin ich nicht gut genug.','Wenn ich Hilfe brauche, bin ich schwach.',
  'Wenn andere besser sind als ich, habe ich versagt.','Wenn ich traurig bin, bin ich schwach.',
  'Wenn ich jemanden enttäusche, bin ich schlecht.','Wenn ich nicht perfekt bin, zähle ich nicht.',
  'Wenn ich allein bin, will mich niemand.','Wenn ich zögere, bin ich ein Feigling.',
];

const ALTERNATIVES = [
  'Die Situation war ungewöhnlich schwierig.',
  'Ein einzelner Moment definiert nicht meinen Wert.',
  'Andere Menschen machen ähnliche Erfahrungen.',
  'Ich habe gerade einen besonders schweren Tag.',
  'Ich kann aus dieser Situation lernen.',
  'Ich bin gerade erschöpft oder überlastet.',
  'Ich mache mir manchmal unrealistisch hohe Ansprüche.',
  'Ich habe in der Vergangenheit auch Dinge gut gemacht.',
  'Scheitern gehört zum Menschsein dazu.',
  'Ich habe gerade wenig Schlaf / bin erschöpft.',
  'Ich tue das Beste, was ich in dieser Situation kann.',
  'Ein Fehler ist nicht dasselbe wie ein Versagen.',
  'Diese Erfahrung kann mich stärker machen.',
  'Niemand ist immer gleich stark.',
  'Ich darf Mitgefühl für mich selbst haben.',
  'Schwierige Gefühle sind kein Zeichen von Schwäche.',
];

const NEEDS = [
  {l:'Verständnis',v:'Verständnis'},{l:'Geduld',v:'Geduld'},
  {l:'Unterstützung',v:'Unterstützung'},{l:'Ruhe',v:'Ruhe'},
  {l:'Motivation',v:'Motivation'},{l:'Erholung',v:'Erholung'},
  {l:'Selbstmitgefühl',v:'Selbstmitgefühl'},{l:'Verbindung',v:'Verbindung'},
  {l:'Klarheit',v:'Klarheit'},{l:'Akzeptanz',v:'Akzeptanz'},
  {l:'Freude',v:'Freude'},{l:'Etwas anderes',v:'Etwas anderes'},
];

const STEP_PROMPTS = ['Was ist ein kleiner Schritt, den du heute tun kannst?','Was wäre heute möglich?','Welche Aktion liegt in deiner Hand?'];
const TOTAL = 9;
let currentStep = 0;

// ── RENDER ENGINE ────────────────────────────────────────────────────
function render(n) {
  currentStep = n;
  document.getElementById('progressFill').style.width = Math.round((n-1)/TOTAL*100) + '%';

  const stage = document.getElementById('stage');
  const old = stage.querySelector('.step-card');
  if (old) { old.classList.remove('entering'); old.classList.add('leaving'); setTimeout(()=> old.remove(), 300); }

  const card = document.createElement('div');
  card.className = 'step-card';

  const builders = [null,s1,s2,s3,s4,s5,s6,s7,s8,sClose];
  builders[n](card);
  setTimeout(()=>{ stage.appendChild(card); card.classList.add('entering'); window.scrollTo(0,0); }, old ? 260 : 0);
}

function lbl(n, title) {
  return `<div class="step-label"><div class="step-dot">${n}</div>${title}</div>`;
}
function q(text) { return `<div class="step-q">${text}</div>`; }
function sub(text) { return `<div class="step-sub">${text}</div>`; }

function thoughtDisplay(stepClass) {
  if (!A.thought) return '';
  const badges = stepClass >= 3 ? '<div class="td-interpretation-badge">Interpretation · kein Fakt</div>' : '';
  return `<div class="thought-display td-step${stepClass}">
    <div class="td-label">Dein Gedanke</div>
    <div class="td-text">„${A.thought}"</div>
    ${badges}
  </div>`;
}

function foot(canCont, nextFn, backFn, contLabel='Weiter →') {
  const back = backFn ? `<button class="btn-back-step" onclick="${backFn}">← Zurück</button>` : '<span></span>';
  return `<div class="step-footer">${back}
    <button class="btn-continue" id="btnC" onclick="${nextFn}" ${canCont?'':'disabled'}>
      ${contLabel}
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>`;
}

function chipList(items, onClickFn, selectedArr) {
  return items.map((item,i) => {
    const sel = selectedArr ? selectedArr.includes(item) : false;
    const txt = typeof item === 'string' ? item : item.l;
    return `<button class="chip${sel?' selected':''}" onclick="${onClickFn}(${i})">${txt}</button>`;
  }).join('');
}

// ── STEP 1: THE THOUGHT ───────────────────────────────────────────────
function s1(card) {
  card.innerHTML = `
    ${lbl(1,'Der Gedanke')}
    ${q('Welcher Gedanke beschäftigt dich gerade?')}
    ${sub('Schreib ihn so auf, wie er in deinem Kopf klingt — roh, unzensiert, echt.')}
    <textarea class="big-textarea" id="ta1" maxlength="200" rows="3"
      placeholder="z.B. Ich bin nicht gut genug."
      oninput="A.thought=this.value.trim();syncBtn(!!A.thought);document.getElementById('cc1').textContent=this.value.length+'/200'"
    >${A.thought}</textarea>
    <div class="char-row"><div class="char-count" id="cc1">${A.thought.length}/200</div></div>
    <div class="chips-label">Beispiele — tippe drauf um es zu übernehmen</div>
    <div class="chips-wrap" id="thoughtChips">${THOUGHT_EXAMPLES.map((t,i)=>`<button class="chip" onclick="useThought(${i})">${t}</button>`).join('')}</div>
    ${foot(!!A.thought,'n1()','','Weiter →')}`;
}
function useThought(i) {
  A.thought = THOUGHT_EXAMPLES[i];
  document.getElementById('ta1').value = A.thought;
  document.getElementById('cc1').textContent = A.thought.length+'/200';
  syncBtn(true);
}
function n1() { A.thought=document.getElementById('ta1').value.trim(); if(!A.thought)return; render(2); }

// ── STEP 2: SITUATION + DEFUSION ANIMATION ────────────────────────────
function s2(card) {
  card.innerHTML = `
    ${lbl(2,'Das Ereignis')}
    ${q('Welches Ereignis oder welche Situation hat diesen Gedanken ausgelöst?')}
    ${sub('Beschreibe kurz, was konkret passiert ist — ohne Bewertung. Nur das, was man beobachten würde.')}
    <div class="defusion-container">
      <div class="defusion-thought" id="thoughtBox">„${A.thought}"</div>
      <textarea class="big-textarea" id="ta2" maxlength="200" rows="3"
        placeholder="z.B. Ich habe eine wichtige Prüfung nicht bestanden."
        oninput="A.situation=this.value.trim();syncBtn(!!A.situation);updateDefusion()"
      >${A.situation}</textarea>
      <div class="defusion-split" id="defSplit" ${A.situation?'style="opacity:0"':'style="display:none"'}>
        <div class="defusion-event">
          <div class="def-col-label">Was passiert ist</div>
          <div class="def-col-text" id="defEvent">${A.situation}</div>
        </div>
        <div class="defusion-arrow">→</div>
        <div class="defusion-interp">
          <div class="def-col-label">Dein Gedanke dazu</div>
          <div class="def-col-text">${A.thought}</div>
        </div>
      </div>
      <div class="defusion-note" id="defNote">${A.situation?'Das Ereignis und deine Interpretation davon sind zwei verschiedene Dinge.':''}</div>
    </div>
    ${foot(!!A.situation,'n2()','render(1)')}`;
  if (A.situation) setTimeout(()=>showDefusion(), 100);
}
function updateDefusion() {
  const ta = document.getElementById('ta2');
  const split = document.getElementById('defSplit');
  const note  = document.getElementById('defNote');
  const eventText = document.getElementById('defEvent');
  if (ta && ta.value.trim()) {
    if (eventText) eventText.textContent = ta.value.trim();
    if (split) { split.style.display=''; setTimeout(()=>showDefusion(),50); }
  } else {
    if (split) { split.style.opacity='0'; split.style.transform='translateY(12px)'; }
    if (note)  { note.style.opacity='0'; note.textContent=''; }
  }
}
function showDefusion() {
  const split = document.getElementById('defSplit');
  const note  = document.getElementById('defNote');
  if (split) { split.classList.add('visible'); }
  setTimeout(()=>{
    if (note) { note.textContent='Das Ereignis und deine Interpretation davon sind zwei verschiedene Dinge.'; note.classList.add('visible'); }
  }, 800);
}
function n2() { A.situation=document.getElementById('ta2').value.trim(); if(!A.situation)return; render(3); }

// ── STEP 3: CONCLUSION ────────────────────────────────────────────────
function s3(card) {
  card.innerHTML = `
    ${lbl(3,'Die Schlussfolgerung')}
    ${q('Welche Bedeutung gibst du diesem Gedanken?')}
    ${sub('Was sagst du dir innerlich, wenn du diesen Gedanken hast?')}
    ${thoughtDisplay(3)}
    <textarea class="big-textarea" id="ta3" maxlength="200" rows="3"
      placeholder="z.B. Wenn ich scheitere, bin ich wertlos."
      oninput="A.conclusion=this.value.trim();syncBtn(!!A.conclusion)"
    >${A.conclusion}</textarea>
    <div class="chips-label">Erkennst du dich hier wieder?</div>
    <div class="chips-wrap">${CONCLUSION_EXAMPLES.map((t,i)=>`<button class="chip" onclick="useConclusion(${i})">${t}</button>`).join('')}</div>
    ${foot(!!A.conclusion,'n3()','render(2)')}`;
}
function useConclusion(i) { A.conclusion=CONCLUSION_EXAMPLES[i]; document.getElementById('ta3').value=A.conclusion; syncBtn(true); }
function n3() { A.conclusion=document.getElementById('ta3').value.trim(); if(!A.conclusion)return; render(4); }

// ── STEP 4: ALTERNATIVES ──────────────────────────────────────────────
function s4(card) {
  card.innerHTML = `
    ${lbl(4,'Andere Möglichkeiten')}
    ${q('Welche anderen Erklärungen könnten auch zutreffen?')}
    ${sub('Kein Richtig oder Falsch. Wähle, was sich auch nur ein kleines bisschen wahr anfühlen könnte.')}
    ${thoughtDisplay(4)}
    <div class="alt-grid" id="altGrid">
      ${ALTERNATIVES.map((a,i)=>`<button class="alt-chip ${A.alternatives.includes(a)?'selected':''}" id="ac${i}" onclick="toggleAlt(${i})">${a}</button>`).join('')}
    </div>
    <div class="optional-tag" style="margin-top:.8rem;">Eigene Perspektive hinzufügen (optional):</div>
    <input class="simple-input" id="altCustom" placeholder="Eine weitere Möglichkeit …" value="${A.altCustom}" oninput="A.altCustom=this.value">
    ${foot(true,'n4()','render(3)')}`;
}
function toggleAlt(i) {
  const val = ALTERNATIVES[i];
  const idx = A.alternatives.indexOf(val);
  if (idx>-1) A.alternatives.splice(idx,1); else A.alternatives.push(val);
  document.getElementById('ac'+i)?.classList.toggle('selected', A.alternatives.includes(val));
}
function n4() { A.altCustom=document.getElementById('altCustom')?.value.trim()||''; render(5); }

// ── STEP 5: NEUTRAL OBSERVER ──────────────────────────────────────────
function s5(card) {
  const hint = A.situation ? `z.B. „Jemand hat ${A.situation.toLowerCase().replace(/^ich habe /,'').replace(/^ich bin /,'eine Person ist ')}."`  : 'Beschreibe nur, was jemand von außen beobachten würde.';
  card.innerHTML = `
    ${lbl(5,'Der neutrale Blick')}
    ${q('Wie würde eine neutrale Person die Situation beschreiben?')}
    ${sub('Nur das Beobachtbare — ohne Bewertung, ohne Interpretation. Wie eine Kamera.')}
    ${thoughtDisplay(5)}
    <div style="font-size:12px;color:var(--faint);margin-bottom:.7rem;font-family:var(--lora);font-style:italic;">Tipp: ${hint}</div>
    <textarea class="big-textarea" id="ta5" maxlength="200" rows="3"
      placeholder="Jemand hat …"
      oninput="A.neutral=this.value.trim();syncBtn(!!A.neutral)"
    >${A.neutral}</textarea>
    ${foot(!!A.neutral,'n5()','render(4)')}`;
}
function n5() { A.neutral=document.getElementById('ta5').value.trim(); if(!A.neutral)return; render(6); }

// ── STEP 6: FRIEND TEST ───────────────────────────────────────────────
function s6(card) {
  card.innerHTML = `
    ${lbl(6,'Der Freund-Test')}
    ${q('Würdest du diesen Satz zu einem guten Freund sagen?')}
    ${sub('Stell dir vor, ein Mensch, den du magst, erlebt genau diese Situation.')}
    <div class="thought-display td-step6" style="margin-bottom:1.4rem;font-size:1rem;">
      <div class="td-label">Dein Gedanke</div>
      <div class="td-text" style="font-size:1rem;color:var(--text);">„${A.thought}"</div>
    </div>
    <div class="friend-choices">
      ${[['yes','Ja, das würde ich sagen.'],['maybe','Vielleicht, mit anderen Worten.'],['no','Nein, das würde ich nie sagen.']].map(([v,l])=>
        `<button class="friend-btn ${A.friendTest===v?'selected':''}" onclick="selectFriend('${v}',this)">${l}</button>`
      ).join('')}
    </div>
    ${foot(!!A.friendTest,'n6()','render(5)')}`;
}
function selectFriend(v, btn) {
  A.friendTest=v;
  document.querySelectorAll('.friend-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  syncBtn(true);
}
function n6() { if(!A.friendTest)return; render(7); }

// ── STEP 7: PERSPECTIVE + COMPARISON ANIMATION ────────────────────────
function s7(card) {
  const isHarsh = A.friendTest==='no'||A.friendTest==='maybe';
  const qText = isHarsh
    ? 'Was würdest du stattdessen zu deinem Freund sagen?'
    : 'Du würdest denselben Satz auch sagen. Was genau würdest du deinem Freund sagen?';
  card.innerHTML = `
    ${lbl(7,'Perspektivwechsel')}
    ${q(qText)}
    ${sub('Kein perfekter Satz. Nur das, was du einem Menschen sagen würdest, dem du Gutes gönnst.')}
    ${thoughtDisplay(7)}
    <textarea class="big-textarea" id="ta7" maxlength="200" rows="3"
      placeholder="z.B. Du hast einen Fehler gemacht, aber das macht dich nicht zum Versager."
      oninput="A.friendSays=this.value.trim();syncBtn(!!A.friendSays);updateCompare()"
    >${A.friendSays}</textarea>
    <div class="compare-stage" id="compareStage" style="${A.friendSays?'':'display:none'}">
      <div class="compare-split ${A.friendSays?'visible':''}" id="compSplit">
        <div class="compare-col friend">
          <div class="cc-label">Für deinen Freund</div>
          <div class="cc-text" id="ccFriend">${A.friendSays}</div>
        </div>
        <div class="compare-col self">
          <div class="cc-label">Für dich selbst</div>
          <div class="cc-text">${A.thought}</div>
        </div>
      </div>
      ${isHarsh ? `<div style="text-align:center;margin-top:10px;font-size:12px;color:var(--faint);font-family:var(--lora);font-style:italic;">Warum gelten für dich strengere Maßstäbe?</div>` : ''}
    </div>
    <div class="optional-tag" style="margin-top:.8rem;">Hast du eine Antwort auf das? (optional)</div>
    <input class="simple-input" id="inp7b" placeholder="Gedanke dazu …" value="${A.stricterReason}" oninput="A.stricterReason=this.value">
    ${foot(!!A.friendSays,'n7()','render(6)')}`;
  if (A.friendSays) setTimeout(()=>showCompare(), 80);
}
function updateCompare() {
  const val = document.getElementById('ta7')?.value.trim()||'';
  A.friendSays = val;
  const stage = document.getElementById('compareStage');
  const split  = document.getElementById('compSplit');
  const ccF    = document.getElementById('ccFriend');
  if (val) {
    if (stage) stage.style.display='';
    if (ccF)   ccF.textContent = val;
    setTimeout(()=>showCompare(), 50);
  } else {
    if (stage) stage.style.display='none';
  }
}
function showCompare() {
  const split = document.getElementById('compSplit');
  if (split) split.classList.add('visible');
}
function n7() { A.friendSays=document.getElementById('ta7').value.trim(); A.stricterReason=document.getElementById('inp7b')?.value.trim()||''; if(!A.friendSays)return; render(8); }

// ── STEP 8: NEEDS ─────────────────────────────────────────────────────
function s8(card) {
  card.innerHTML = `
    ${lbl(8,'Was ich brauche')}
    ${q('Was würde dir in dieser Situation gerade helfen?')}
    ${sub('Mehreres auswählen ist in Ordnung. Alles zählt.')}
    ${thoughtDisplay(8)}
    <div class="needs-grid">
      ${NEEDS.map((n,i)=>`<button class="need-btn ${A.needs.includes(n.v)?'selected':''}" id="nb${i}" onclick="toggleNeed(${i})">${n.l}</button>`).join('')}
    </div>
    ${foot(true,'n8()','render(7)','Abschließen →')}`;
}
function toggleNeed(i) {
  const v=NEEDS[i].v;
  const idx=A.needs.indexOf(v);
  if(idx>-1)A.needs.splice(idx,1); else A.needs.push(v);
  document.getElementById('nb'+i)?.classList.toggle('selected',A.needs.includes(v));
}
function n8() { render(9); }

// ── CLOSING ───────────────────────────────────────────────────────────
function sClose(card) {
  document.getElementById('progressFill').style.width='100%';
  const needsText = A.needs.length ? A.needs.join(' · ') : '';
  const alts = [...A.alternatives, A.altCustom].filter(Boolean);
  const altText = alts[0]||'Ein einzelner Moment definiert nicht meinen Wert.';

  const takeaways = [
    A.friendSays ? `„${A.friendSays}"` : null,
    'Ich darf freundlich mit mir selbst sein.',
    'Dieser Gedanke ist nicht die ganze Wahrheit.',
    A.needs[0] ? `Ich brauche gerade ${A.needs[0]} — und das ist erlaubt.` : null,
    'Ein Fehler macht mich nicht zu einem Fehler.',
    altText,
    'Meine Gefühle sind real, aber meine Gedanken sind kein Fakten.',
    A.neutral ? `Was wirklich passiert ist: ${A.neutral}` : null,
  ].filter(Boolean).slice(0,6);

  card.innerHTML = `
    <div class="step-label"><div class="step-dot" style="background:var(--sage)">✓</div>Deine Reflexion</div>
    ${q('Das hast du heute angeschaut.')}
    ${sub('Gedanken sind nicht automatisch Fakten. Ereignisse und Bewertungen sind nicht dasselbe.')}

    <div class="closing-card">
      <div class="closing-row">
        <div class="cr-label">Vorher — der Gedanke</div>
        <div class="cr-text was">„${A.thought}"</div>
      </div>
      <div class="cr-divider"></div>
      <div class="closing-row">
        <div class="cr-label">Was tatsächlich passiert ist</div>
        <div class="cr-text">${A.situation}</div>
      </div>
      ${A.friendSays?`
      <div class="cr-divider"></div>
      <div class="closing-row">
        <div class="cr-label">Was du einem Freund sagen würdest</div>
        <div class="cr-text highlighted">${A.friendSays}</div>
      </div>`:''}
      ${needsText?`
      <div class="cr-divider"></div>
      <div class="closing-row">
        <div class="cr-label">Was du gerade brauchst</div>
        <div class="cr-text">${needsText}</div>
      </div>`:''}
    </div>

    <div class="step-q" style="font-size:18px;margin-bottom:.4rem;">Welchen Satz nimmst du heute mit?</div>
    <div class="step-sub">Formuliere deinen eigenen — oder wähle einen Vorschlag.</div>
    <textarea class="big-textarea" id="taTakeaway" rows="2"
      placeholder="z.B. Ich darf freundlich mit mir umgehen."
      oninput="A.takeaway=this.value.trim()"
    >${A.takeaway}</textarea>
    <div class="chips-label">Vorschläge</div>
    <div class="takeaway-chips-wrap">
      ${takeaways.map(t=>`<button class="takeaway-chip" onclick="useTakeaway('${t.replace(/'/g,"\\'")}')">${t}</button>`).join('')}
    </div>

    <div class="finish-actions">
      <button class="btn-primary" onclick="saveFinish()">In Journal speichern</button>
      <button class="btn-secondary" onclick="render(1)">Neu beginnen</button>
      <a href="tools.html" class="btn-secondary">← Tools</a>
    </div>`;
}
function useTakeaway(t) { const ta=document.getElementById('taTakeaway'); if(ta){ta.value=t;A.takeaway=t;} }
function saveFinish() {
  A.takeaway=document.getElementById('taTakeaway')?.value.trim()||'';
  alert('In einer echten App wird dieser Eintrag in dein Journal gespeichert.\n\n'+(A.takeaway?`Dein Satz: „${A.takeaway}"`:''));
}

function syncBtn(enabled) { const b=document.getElementById('btnC'); if(b) b.disabled=!enabled; }

// ── START ─────────────────────────────────────────────────────────────
render(1);
</script>
</body>
</html>
