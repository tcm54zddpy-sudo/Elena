<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindbloom — Prepare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Mulish:wght@300;400;500&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F8F7F4;--white:#FFFFFF;
  --border:rgba(0,0,0,.08);--border-m:rgba(0,0,0,.13);
  --text:#1A1A1A;--muted:#6B6B6B;--faint:#ABABAB;
  --g-sage:linear-gradient(135deg,#C8D8C0,#8FAF88);
  --g-dusk:linear-gradient(135deg,#C4C0DC,#8A84B8);
  --g-blush:linear-gradient(135deg,#DEC9C4,#BF9690);
  --g-slate:linear-gradient(135deg,#B8CCDA,#7A9DB5);
  --g-amber:linear-gradient(135deg,#DDD0B0,#BCA870);
  --g-prepare:linear-gradient(135deg,#C0CCDC,#7888A8);
  --sage:#5A8050;--dusk:#6A64A0;--blush:#9A6A64;--slate:#4A7A95;
  --serif:'Playfair Display',Georgia,serif;
  --lora:'Lora',Georgia,serif;
  --sans:'Mulish',sans-serif;
  --r:16px;
}
html,body{min-height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:var(--sans);border:none;background:none;}
textarea,input{font-family:var(--lora);font-size:15px;}

/* NAV */

/* LAYOUT */
.page{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 1.2rem 5rem;}
.card-wrap{width:100%;max-width:560px;padding-top:2.2rem;}

/* PROGRESS */
.prog-row{display:flex;align-items:center;gap:.7rem;margin-bottom:2rem;}
.prog-bar-bg{flex:1;height:2px;background:var(--border-m);border-radius:10px;}
.prog-bar-fill{height:100%;border-radius:10px;background:var(--text);transition:width .5s ease;}
.prog-label{font-size:11px;color:var(--faint);white-space:nowrap;letter-spacing:.05em;}

/* STEP CARD */
.step-card{background:var(--white);border:1px solid var(--border);border-radius:22px;padding:2rem 2rem 1.6rem;animation:fadeUp .35s ease;}
.step-tag{font-size:10px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:.6rem;}
.step-q{font-family:var(--serif);font-size:1.3rem;font-weight:400;line-height:1.35;margin-bottom:.4rem;}
.step-sub{font-size:13.5px;color:var(--muted);margin-bottom:1.4rem;line-height:1.6;}

/* OPTION PILLS */
.options{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.2rem;}
.opt{text-align:left;padding:13px 16px;border-radius:13px;border:1px solid var(--border-m);background:var(--bg);font-size:14px;color:var(--muted);font-family:var(--sans);font-weight:300;transition:all .14s;line-height:1.45;}
.opt:hover{background:var(--white);color:var(--text);border-color:rgba(0,0,0,.2);transform:translateX(3px);}
.opt.sel{background:var(--white);color:var(--text);border-color:rgba(0,0,0,.22);box-shadow:0 2px 12px rgba(0,0,0,.07);}

/* MULTI CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.2rem;}
.chip{padding:8px 15px;border-radius:100px;border:1px solid var(--border-m);background:var(--bg);font-size:13px;color:var(--muted);font-family:var(--sans);transition:all .14s;}
.chip:hover{color:var(--text);border-color:rgba(0,0,0,.2);}
.chip.sel{background:var(--white);color:var(--text);border-color:rgba(0,0,0,.22);box-shadow:0 2px 8px rgba(0,0,0,.07);}

/* TEXTAREA */
.ta{width:100%;min-height:90px;border:1px solid var(--border-m);border-radius:var(--r);padding:13px 15px;font-family:var(--lora);font-size:14.5px;font-style:italic;color:var(--text);background:var(--white);outline:none;resize:none;line-height:1.7;margin-bottom:1.2rem;}
.ta::placeholder{color:var(--faint);}
.ta:focus{box-shadow:0 2px 14px rgba(0,0,0,.06);}

/* RANGE / BATTERY */
.battery-wrap{margin-bottom:1.4rem;}
.battery-label-row{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-bottom:.5rem;}
.battery-visual{width:100%;height:28px;background:var(--bg);border:1px solid var(--border-m);border-radius:8px;overflow:hidden;position:relative;margin-bottom:.4rem;}
.battery-fill{height:100%;border-radius:7px;transition:width .3s ease;}
.battery-val{text-align:center;font-size:12px;color:var(--muted);}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:10px;background:var(--border-m);outline:none;margin-bottom:.3rem;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--text);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);}

/* IF-THEN BUILDER */
.ifthen-list{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1rem;}
.ifthen-row{background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:1rem 1.1rem;}
.ifthen-row .lbl{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:.3rem;}
.ifthen-ta{width:100%;border:none;background:none;outline:none;font-family:var(--lora);font-style:italic;font-size:14px;color:var(--text);resize:none;min-height:44px;line-height:1.6;}
.ifthen-ta::placeholder{color:var(--faint);}
.add-btn{font-size:12.5px;color:var(--muted);border:1px dashed var(--border-m);border-radius:100px;padding:7px 16px;transition:all .15s;display:inline-flex;align-items:center;gap:.4rem;}
.add-btn:hover{color:var(--text);border-color:var(--text);}

/* FOOTER */
.step-footer{display:flex;align-items:center;justify-content:space-between;padding-top:1.2rem;border-top:1px solid var(--border);margin-top:.4rem;}
.btn-next{display:inline-flex;align-items:center;gap:.5rem;background:var(--text);color:#fff;border-radius:100px;padding:11px 22px;font-size:13px;font-weight:500;letter-spacing:.04em;transition:opacity .18s,transform .1s;}
.btn-next:hover{opacity:.85;transform:translateY(-1px);}
.btn-next:disabled{opacity:.28;cursor:not-allowed;transform:none;}
.btn-back{display:inline-flex;align-items:center;gap:.4rem;color:var(--muted);border:1px solid var(--border-m);border-radius:100px;padding:10px 18px;font-size:12.5px;transition:all .15s;}
.btn-back:hover{color:var(--text);border-color:var(--text);}

/* TOOL SELECTION */
.tool-grid{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.2rem;}
.tool-opt{display:flex;align-items:flex-start;gap:1rem;padding:14px 16px;border-radius:14px;border:1px solid var(--border-m);background:var(--bg);text-align:left;transition:all .15s;cursor:pointer;}
.tool-opt:hover{background:var(--white);border-color:rgba(0,0,0,.18);transform:translateX(3px);}
.tool-opt.sel{background:var(--white);border-color:rgba(0,0,0,.2);box-shadow:0 2px 12px rgba(0,0,0,.07);}
.tool-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px;}
.tool-info .t-name{font-family:var(--serif);font-size:.95rem;font-weight:400;margin-bottom:2px;}
.tool-info .t-desc{font-size:12.5px;color:var(--muted);line-height:1.5;}

/* RESULT / PLAN */
.plan-card{background:var(--white);border:1px solid var(--border);border-radius:22px;padding:1.8rem 2rem;margin-bottom:.8rem;animation:fadeUp .4s ease;}
.plan-section{margin-bottom:1.4rem;}
.plan-section:last-child{margin-bottom:0;}
.plan-icon-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;}
.plan-emoji{font-size:1.1rem;}
.plan-section-title{font-family:var(--serif);font-size:1rem;font-weight:400;}
.plan-body{font-size:13.5px;color:var(--muted);line-height:1.7;}
.plan-tag{display:inline-block;padding:3px 11px;border-radius:100px;font-size:11.5px;font-weight:500;margin-bottom:.5rem;}
.plan-item{padding:9px 13px;background:var(--bg);border-radius:10px;font-size:13.5px;margin-bottom:.4rem;color:var(--text);font-family:var(--lora);font-style:italic;}
.plan-divider{height:1px;background:var(--border);margin:1.2rem 0;}
.result-actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.4rem;}

/* INTRO SCREEN */
.intro-card{background:var(--white);border:1px solid var(--border);border-radius:22px;padding:2.2rem 2rem;text-align:center;animation:fadeUp .4s ease;}
.intro-orb{width:64px;height:64px;border-radius:50%;background:var(--g-prepare);margin:0 auto 1.2rem;display:flex;align-items:center;justify-content:center;}
.intro-title{font-family:var(--serif);font-size:1.6rem;font-weight:400;margin-bottom:.5rem;}
.intro-sub{font-size:14px;color:var(--muted);line-height:1.7;max-width:360px;margin:0 auto 1.6rem;}
.intro-tags{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:1.8rem;}
.intro-tag{font-size:12px;padding:4px 12px;border-radius:100px;background:var(--bg);border:1px solid var(--border-m);color:var(--muted);}

/* SECTION HEADER between tools */
.tool-header{margin-bottom:1.2rem;}
.tool-header-tag{font-size:10px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:.3rem;}
.tool-header-title{font-family:var(--serif);font-size:1.1rem;font-weight:400;}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:520px){
  .step-card{padding:1.5rem 1.3rem 1.3rem;}
  .intro-card{padding:1.8rem 1.3rem;}
  .plan-card{padding:1.5rem 1.3rem;}
}
</style>
  <script src="nav.js"></script>
</head>
<body>
  <div id="site-nav-placeholder"></div>
  

<div class="page">
  <div class="card-wrap" id="root"></div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
const S = {
  phase: 'intro',        // intro | finder | tools | tool_X | plan
  situation: null,
  concern: null,
  selectedTools: [],
  activeTool: null,
  toolIndex: 0,
  // tool data
  compass: { person:null, topic:'', goals:[], avoid:[], success:'' },
  redflag: { situation:null, topics:[], persons:'', reactions:[] },
  ifthen: { fear:'', pairs:[{if:'',then:''}] },
  safexit: { situation:null, difficulties:[], signals:[], actions:[] },
  energy: { current:70, cost:50, drains:[], gains:[], prep:'', recharge:'' },
};

// ─── ROUTING ──────────────────────────────────────────────────────────────────
const TOOL_ROUTING = {
  // situation → concern → [tools]
  'gespräch':  { 'sagen':['compass','ifthen'], 'konflikt':['compass','redflag','ifthen'], 'ablehnung':['compass','safexit'], 'überfordert':['compass','energy'], 'default':['compass','ifthen'] },
  'familie':   { 'konflikt':['redflag','ifthen','safexit'], 'überfordert':['energy','safexit'], 'default':['redflag','ifthen','safexit'] },
  'date':      { 'ablehnung':['compass','energy'], 'überfordert':['energy','safexit'], 'default':['compass','energy'] },
  'event':     { 'überfordert':['energy','safexit'], 'energie':['energy'], 'default':['energy','safexit'] },
  'präsentation':{ 'sagen':['compass','ifthen'], 'überfordert':['energy','ifthen'], 'default':['ifthen','energy'] },
  'arzt':      { 'sagen':['compass'], 'überfordert':['compass','energy'], 'default':['compass','energy'] },
  'entscheidung':{ 'überfordert':['ifthen','energy'], 'default':['ifthen','energy'] },
  'anderes':   { 'default':['compass','ifthen','energy'] },
};

const TOOLS_META = {
  compass:  { emoji:'🧭', name:'Conversation Compass', desc:'Klarheit vor schwierigen Gesprächen schaffen.', grad:'var(--g-slate)' },
  redflag:  { emoji:'🚩', name:'Red Flag Predictor',   desc:'Mögliche Stressmomente vorab erkennen.', grad:'var(--g-blush)' },
  ifthen:   { emoji:'📋', name:'If–Then Builder',      desc:'Konkrete Handlungspläne für schwierige Momente.', grad:'var(--g-amber)' },
  safexit:  { emoji:'🛟', name:'Safe Exit Planner',    desc:'Ein Sicherheitsnetz für belastende Situationen.', grad:'var(--g-sage)' },
  energy:   { emoji:'⚡', name:'Energy Forecast',      desc:'Überforderung vorbeugen und Energie planen.', grad:'var(--g-dusk)' },
};

function routeTools() {
  const sit = S.situation || 'anderes';
  const con = S.concern || 'default';
  const routes = TOOL_ROUTING[sit] || TOOL_ROUTING['anderes'];
  const list = routes[con] || routes['default'] || ['compass'];
  S.selectedTools = [...new Set(list)];
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  if (S.phase === 'intro') renderIntro(root);
  else if (S.phase === 'finder1') renderFinder1(root);
  else if (S.phase === 'finder2') renderFinder2(root);
  else if (S.phase === 'tools') renderToolSelect(root);
  else if (S.phase === 'compass') renderCompass(root);
  else if (S.phase === 'redflag') renderRedflag(root);
  else if (S.phase === 'ifthen') renderIfthen(root);
  else if (S.phase === 'safexit') renderSafexit(root);
  else if (S.phase === 'energy') renderEnergy(root);
  else if (S.phase === 'plan') renderPlan(root);
  window.scrollTo({top:0,behavior:'smooth'});
}

// ─── PROGRESS BAR ─────────────────────────────────────────────────────────────
function progHTML(pct, label) {
  return `<div class="prog-row">
    <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
    <div class="prog-label">${label}</div>
  </div>`;
}

// ─── INTRO ────────────────────────────────────────────────────────────────────
function renderIntro(root) {
  root.innerHTML = `
    <div class="intro-card">
      <div class="intro-orb">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="intro-title">Prepare</div>
      <div class="intro-sub">Mentale Vorbereitung für Situationen, die dich beschäftigen. Kein Test, keine Therapie — nur Klarheit und ein Plan, der zu dir passt.</div>
      <div class="intro-tags">
        <span class="intro-tag">Schwierige Gespräche</span>
        <span class="intro-tag">Familientreffen</span>
        <span class="intro-tag">Dates</span>
        <span class="intro-tag">Präsentationen</span>
        <span class="intro-tag">Soziale Events</span>
        <span class="intro-tag">Konflikte</span>
        <span class="intro-tag">Wichtige Entscheidungen</span>
      </div>
      <button class="btn-next" style="width:100%;justify-content:center;" onclick="go('finder1')">
        Loslegen
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>`;
}

// ─── FINDER 1 ─────────────────────────────────────────────────────────────────
const SITUATIONS = [
  { key:'gespräch',     label:'Ein schwieriges Gespräch' },
  { key:'familie',      label:'Ein Familientreffen' },
  { key:'date',         label:'Ein Date' },
  { key:'event',        label:'Ein soziales Event' },
  { key:'präsentation', label:'Eine Präsentation oder Prüfung' },
  { key:'arzt',         label:'Ein Arzt- oder Therapietermin' },
  { key:'entscheidung', label:'Eine schwierige Entscheidung' },
  { key:'anderes',      label:'Etwas anderes' },
];

function renderFinder1(root) {
  root.innerHTML = progHTML(15,'Schritt 1 von 2') + `
    <div class="step-card">
      <div class="step-tag">Situation</div>
      <div class="step-q">Worauf möchtest du dich vorbereiten?</div>
      <div class="step-sub">Wähle das, was am nächsten dran ist.</div>
      <div class="options">
        ${SITUATIONS.map(s=>`<button class="opt ${S.situation===s.key?'sel':''}" onclick="setSituation('${s.key}')">${s.label}</button>`).join('')}
      </div>
      <div class="step-footer">
        <button class="btn-back" onclick="go('intro')">← Zurück</button>
        <button class="btn-next" onclick="go('finder2')" ${S.situation?'':'disabled'}>
          Weiter <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>`;
}
function setSituation(k){ S.situation=k; render(); }

// ─── FINDER 2 ─────────────────────────────────────────────────────────────────
const CONCERNS = [
  { key:'sagen',      label:'Ich weiß nicht, was ich sagen soll.' },
  { key:'konflikt',   label:'Ich habe Angst vor Konflikten.' },
  { key:'ablehnung',  label:'Ich habe Angst vor Ablehnung.' },
  { key:'überfordert',label:'Ich fühle mich überfordert.' },
  { key:'energie',    label:'Ich habe wenig Energie.' },
  { key:'situationen',label:'Ich rechne mit schwierigen Situationen.' },
  { key:'allgemein',  label:'Ich möchte mich allgemein vorbereiten.' },
];

function renderFinder2(root) {
  root.innerHTML = progHTML(30,'Schritt 2 von 2') + `
    <div class="step-card">
      <div class="step-tag">Fokus</div>
      <div class="step-q">Was beschäftigt dich am meisten?</div>
      <div class="step-sub">Keine richtige oder falsche Antwort.</div>
      <div class="options">
        ${CONCERNS.map(c=>`<button class="opt ${S.concern===c.key?'sel':''}" onclick="setConcern('${c.key}')">${c.label}</button>`).join('')}
      </div>
      <div class="step-footer">
        <button class="btn-back" onclick="go('finder1')">← Zurück</button>
        <button class="btn-next" onclick="finishFinder()" ${S.concern?'':'disabled'}>
          Meine Tools sehen <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>`;
}
function setConcern(k){ S.concern=k; render(); }
function finishFinder(){ routeTools(); go('tools'); }

// ─── TOOL SELECT ──────────────────────────────────────────────────────────────
function renderToolSelect(root) {
  root.innerHTML = progHTML(40,'Deine Tools') + `
    <div class="step-card">
      <div class="step-tag">Empfehlung</div>
      <div class="step-q">Diese Tools passen zu deiner Situation.</div>
      <div class="step-sub">Du kannst alle nacheinander durchgehen — oder nur das auswählen, das dich gerade am meisten anspricht.</div>
      <div class="tool-grid">
        ${S.selectedTools.map(k=>{
          const t = TOOLS_META[k];
          return `<button class="tool-opt" onclick="startTool('${k}')">
            <div class="tool-icon" style="background:${t.grad};">${t.emoji}</div>
            <div class="tool-info">
              <div class="t-name">${t.name}</div>
              <div class="t-desc">${t.desc}</div>
            </div>
          </button>`;
        }).join('')}
      </div>
      <div class="step-footer">
        <button class="btn-back" onclick="go('finder2')">← Zurück</button>
        <button class="btn-next" onclick="startFirst()">
          Alle durchgehen <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>`;
}
function startFirst(){ S.toolIndex=0; startTool(S.selectedTools[0]); }
function startTool(k){ S.activeTool=k; go(k); }

// ─── COMPASS ──────────────────────────────────────────────────────────────────
let compassStep = 0;
const COMPASS_GOALS = ['Gehört werden','Verständnis schaffen','Grenze setzen','Ehrlich sein','Konflikt lösen','Beziehung stärken'];
const COMPASS_AVOID = ['Laut werden','Schuldzuweisungen','Rückzieher machen','Abschweifen','Recht haben müssen'];
const COMPASS_PERSONS = ['Elternteil','Partner:in','Freund:in','Kolleg:in','Chef:in','Andere Person'];

function renderCompass(root) {
  const steps = [renderCompassP, renderCompassTopic, renderCompassGoals, renderCompassAvoid, renderCompassSuccess];
  const pct = 40 + (compassStep/steps.length)*25;
  root.innerHTML = progHTML(pct, `Compass · ${compassStep+1} / ${steps.length}`);
  const card = document.createElement('div');
  card.className = 'step-card';
  steps[compassStep](card);
  root.appendChild(card);
}

function renderCompassP(card) {
  card.innerHTML = `<div class="step-tag">Conversation Compass</div>
    <div class="step-q">Mit wem wirst du sprechen?</div>
    <div class="options">
      ${COMPASS_PERSONS.map(p=>`<button class="opt ${S.compass.person===p?'sel':''}" onclick="compassPick('person','${p}')">${p}</button>`).join('')}
    </div>
    ${compassFoot(!!S.compass.person, ()=>compassStep=1, ()=>go('tools'))}`;
}
function renderCompassTopic(card) {
  card.innerHTML = `<div class="step-tag">Conversation Compass</div>
    <div class="step-q">Worum geht es?</div>
    <div class="step-sub">Kurz und in deinen eigenen Worten.</div>
    <textarea class="ta" placeholder="z.B. Ich möchte klären, dass ich mehr Freiraum brauche." oninput="S.compass.topic=this.value">${S.compass.topic}</textarea>
    ${compassFoot(true, ()=>compassStep=2, ()=>compassStep=0)}`;
}
function renderCompassGoals(card) {
  card.innerHTML = `<div class="step-tag">Conversation Compass</div>
    <div class="step-q">Was ist dein eigentliches Ziel?</div>
    <div class="step-sub">Wähle maximal 2.</div>
    <div class="chips">

function finishTool() {
  const idx = S.selectedTools.indexOf(S.activeTool);

    <button class="btn-next" onclick="restart()">
      Neuer Plan
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
    </button>
    <a href="tools.html" class="btn-back">← Alle Tools</a>
  </div>`;

  card.innerHTML = html;
  root.appendChild(card);
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function toggleChip(obj, field, val, max) {
  const arr = S[obj][field];
  const idx = arr.indexOf(val);
  if (idx > -1) arr.splice(idx, 1);
  else if (arr.length < max) arr.push(val);
  render();
}
function go(phase) { S.phase = phase; render(); }
function restart() {
  Object.assign(S, {
    phase:'intro', situation:null, concern:null, selectedTools:[], activeTool:null, toolIndex:0,
    compass:{person:null,topic:'',goals:[],avoid:[],success:''},
    redflag:{situation:null,topics:[],persons:'',reactions:[]},
    ifthen:{fear:'',pairs:[{if:'',then:''}]},
    safexit:{situation:null,difficulties:[],signals:[],actions:[]},
    energy:{current:70,cost:50,drains:[],gains:[],prep:'',recharge:''},
  });
  compassStep=0; rfStep=0; itStep=0; sxStep=0; enStep=0;
  render();
}

render();
</script>
