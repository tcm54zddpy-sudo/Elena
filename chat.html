<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindbloom — Nachrichten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="nav.js?v=7"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #F8F7F4;
  --white:     #FFFFFF;
  --border:    rgba(0,0,0,0.08);
  --border-m:  rgba(0,0,0,0.13);
  --text:      #1A1A1A;
  --muted:     #6B6B6B;
  --faint:     #ABABAB;

  --g-sage:    linear-gradient(135deg, #C8D8C0 0%, #8FAF88 100%);
  --g-dusk:    linear-gradient(135deg, #C4C0DC 0%, #8A84B8 100%);
  --g-blush:   linear-gradient(135deg, #DEC9C4 0%, #BF9690 100%);
  --g-slate:   linear-gradient(135deg, #B8CCDA 0%, #7A9DB5 100%);
  --g-amber:   linear-gradient(135deg, #DDD0B0 0%, #BCA870 100%);

  --sage-tint:  #F0F4EE;
  --dusk-tint:  #EEEDF6;
  --sage:   #5A8050;
  --dusk:   #6A64A0;

  --serif:      'EB Garamond', Georgia, serif;
  --serif-body: 'EB Garamond', Georgia, serif;
  --sans:       'Inter', sans-serif;
  --r: 20px; --r-sm: 12px;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-weight: 300;
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family: var(--sans); border: none; }

/* ── NAV ── */

/* ── CHAT LAYOUT ── */
.chat-layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  flex: 1;
  overflow: hidden;
  height: calc(100vh - var(--nav-h));
}

/* ── LEFT: CONVERSATION LIST ── */
.conv-panel {
  border-right: 1px solid var(--border);
  background: var(--white);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.conv-header {
  padding: 1.2rem 1.4rem 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.conv-header h2 {
  font-family: var(--serif); font-size: 1.1rem; font-weight: 400;
  margin-bottom: 1rem;
}
.conv-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 100px; padding: 6px 12px;
  margin-bottom: 1rem;
}
.conv-search input {
  border: none; background: transparent; outline: none;
  font-family: var(--sans); font-size: 13px; font-weight: 300;
  color: var(--text); flex: 1;
}
.conv-search input::placeholder { color: var(--faint); }
.conv-search svg { color: var(--faint); flex-shrink: 0; }

.conv-list { overflow-y: auto; flex: 1; }
.conv-item {
  display: flex; align-items: center; gap: 12px;
  padding: 0.9rem 1.4rem;
  cursor: pointer; transition: background .15s;
  border-left: 3px solid transparent;
  position: relative;
}
.conv-item:hover { background: var(--bg); }
.conv-item.active { background: var(--sage-tint); border-left-color: var(--sage); }
.conv-avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
}
.conv-online {
  position: absolute; left: 46px; top: 12px;
  width: 10px; height: 10px; border-radius: 50%;
  background: #6BAA6A; border: 2px solid var(--white);
}
.conv-info { flex: 1; min-width: 0; }
.conv-name { font-size: 13.5px; font-weight: 500; margin-bottom: 2px; }
.conv-preview {
  font-size: 12.5px; color: var(--faint); font-weight: 300;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.conv-time { font-size: 11px; color: var(--faint); }
.conv-unread {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--sage); color: #fff;
  font-size: 10px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}

.new-msg-btn {
  margin: 1rem 1.4rem;
  padding: 0.5rem 1rem; border-radius: 100px;
  background: var(--text); color: #fff;
  font-size: 12.5px; font-weight: 500; border: none;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: opacity .18s; flex-shrink: 0;
}
.new-msg-btn:hover { opacity: .8; }

/* ── RIGHT: CHAT VIEW ── */
.chat-panel {
  display: flex; flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* empty state */
.chat-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--faint); text-align: center;
  padding: 2rem;
}
.chat-empty svg { opacity: .3; }
.chat-empty p { font-size: 14px; font-weight: 300; font-family: var(--serif-body); font-style: italic; }

.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 1rem 1.6rem;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-header-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
.chat-header-name { font-size: 14px; font-weight: 500; flex: 1; }
.chat-header-online { font-size: 12px; color: #6BAA6A; font-weight: 300; }
.chat-header-actions { display: flex; gap: 8px; }
.chat-icon-btn {
  width: 34px; height: 34px; border-radius: 50%; background: none;
  border: 1px solid var(--border); color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: border-color .18s, color .18s;
}
.chat-icon-btn:hover { border-color: var(--border-m); color: var(--text); }

/* messages */
.messages-area {
  flex: 1; overflow-y: auto; padding: 1.4rem 1.6rem;
  display: flex; flex-direction: column; gap: 4px;
}

.msg-date-divider {
  text-align: center; font-size: 11px; color: var(--faint);
  margin: 12px 0; font-weight: 300;
}

.msg-row {
  display: flex; align-items: flex-end; gap: 8px;
  margin-bottom: 2px;
}
.msg-row.mine { flex-direction: row-reverse; }

.msg-avatar-sm {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  margin-bottom: 2px;
}
.msg-avatar-sm.hidden { opacity: 0; }

.msg-bubble {
  max-width: 68%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px; font-weight: 300; line-height: 1.55;
  position: relative;
}
.msg-row:not(.mine) .msg-bubble {
  background: var(--white);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.msg-row.mine .msg-bubble {
  background: var(--text);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg-time {
  font-size: 10px; color: var(--faint);
  margin-top: 3px; text-align: right;
  padding: 0 4px;
}
.msg-row.mine .msg-time { text-align: right; }

/* typing indicator */
.typing-indicator {
  display: flex; align-items: flex-end; gap: 8px; padding: 0 1.6rem 8px;
}
.typing-dots {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 18px; border-bottom-left-radius: 4px;
  padding: 10px 14px; display: flex; gap: 4px; align-items: center;
}
.typing-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--faint);
  animation: bounce .9s infinite;
}
.typing-dot:nth-child(2) { animation-delay: .15s; }
.typing-dot:nth-child(3) { animation-delay: .3s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30%           { transform: translateY(-5px); }
}

/* input */
.chat-input-area {
  padding: 1rem 1.6rem 1.2rem;
  background: var(--white);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-input-row {
  display: flex; align-items: flex-end; gap: 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 24px; padding: 8px 8px 8px 16px;
  transition: border-color .18s;
}
.chat-input-row:focus-within { border-color: var(--border-m); }
.chat-input {
  flex: 1; border: none; background: transparent; outline: none;
  font-family: var(--sans); font-size: 14px; font-weight: 300;
  color: var(--text); resize: none; max-height: 120px;
  line-height: 1.5; padding: 4px 0;
}
.chat-input::placeholder { color: var(--faint); }
.chat-send-btn {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: var(--text); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .18s;
}
.chat-send-btn:hover { opacity: .8; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg-row { animation: fadeUp .22s ease; }
</style>
  <link rel="stylesheet" href="shared.css">
  <script src="theme.js?v=1"></script>
</head>
<body>
  <div id="site-nav-placeholder"></div>

<!-- NAV -->
  

<!-- CHAT LAYOUT -->
<div class="chat-layout">

  <!-- LEFT: conversations -->
  <div class="conv-panel">
    <div class="conv-header">
      <h2>Nachrichten</h2>
      <div class="conv-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" placeholder="Unterhaltungen durchsuchen …" id="searchInput" oninput="filterConvs(this.value)">
      </div>
    </div>
    <div class="conv-list" id="convList"></div>
    <button class="new-msg-btn" onclick="openNewMsg()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Neue Nachricht
    </button>
  </div>

  <!-- RIGHT: chat view -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-empty" id="chatEmpty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <p>Wähle eine Unterhaltung aus,<br>oder schreib jemandem eine Nachricht.</p>
    </div>

    <div id="chatView" style="display:none; flex-direction:column; height:100%;">
      <div class="chat-header">
        <div class="chat-header-avatar" id="chatAvatar"></div>
        <div>
          <div class="chat-header-name" id="chatName"></div>
          <div class="chat-header-online" id="chatOnline"></div>
        </div>
        <div class="chat-header-actions">
          <button class="chat-icon-btn" title="Profil ansehen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </button>
        </div>
      </div>

      <div class="messages-area" id="messagesArea"></div>

      <div class="typing-indicator" id="typingIndicator" style="display:none;">
        <div class="msg-avatar-sm" id="typingAvatar"></div>
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="chat-input-row">
          <textarea class="chat-input" id="chatInput" rows="1" placeholder="Schreib eine Nachricht …"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"
            oninput="autoResize(this)"></textarea>
          <button class="chat-send-btn" onclick="sendMsg()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const CONVS = [
  {
    id: 1, name: 'Lea M.', grad: 'var(--g-sage)', online: true,
    preview: 'Die Atemübung hat mir heute wirklich geholfen',
    time: '2 Min.', unread: 2,
    messages: [
      { from: 'them', text: 'Hey, ich habe gerade deinen Beitrag über Tools bei Angst gelesen. Das hat mich wirklich berührt.', time: '10:14' },
      { from: 'me',   text: 'Das freut mich sehr. Ich habe eine Weile gebraucht, um herauszufinden, was wirklich hilft.', time: '10:16' },
      { from: 'them', text: 'Nutzt du die Atemübungen hier oft?', time: '10:17' },
      { from: 'me',   text: 'Fast jeden Abend vor dem Schlafen. Der 4-2-4-Rhythmus funktioniert für mich am besten.', time: '10:19' },
      { from: 'them', text: 'Die Atemübung hat mir heute wirklich geholfen', time: '10:41' },
    ]
  },
  {
    id: 2, name: 'Mira S.', grad: 'var(--g-dusk)', online: true,
    preview: 'Sag gern Bescheid, wenn du mal mehr darüber reden möchtest',
    time: '1 Std.', unread: 0,
    messages: [
      { from: 'them', text: 'Ich habe deinen Community-Beitrag über Burnout gelesen. Ich stecke gerade in etwas ganz Ähnlichem.', time: 'Gestern' },
      { from: 'me',   text: 'Es dauert so lange, bis du es überhaupt bemerkst, oder? Du denkst einfach, du bist nur müde.', time: 'Gestern' },
      { from: 'them', text: 'Genau. Ich habe Monate gebraucht, um es benennen zu können.', time: 'Gestern' },
      { from: 'them', text: 'Sag gern Bescheid, wenn du mal mehr darüber reden möchtest', time: 'Gestern' },
    ]
  },
  {
    id: 3, name: 'Tom K.', grad: 'var(--g-amber)', online: false,
    preview: 'Woche 2 geschafft 🌿 es fühlt sich etwas leichter an',
    time: '3 Std.', unread: 1,
    messages: [
      { from: 'them', text: 'Ich folge dir seit der Stimmungstagebuch-Challenge.', time: 'Mo' },
      { from: 'me',   text: 'Ich dir auch — ich sehe deine Updates gern. Woche 2 geschafft 🌿 es fühlt sich etwas leichter an', time: 'Mo' },
      { from: 'them', text: 'Woche 2 geschafft 🌿 es fühlt sich etwas leichter an', time: 'Di' },
    ]
  },
  {
    id: 4, name: 'Jana R.', grad: 'var(--g-blush)', online: false,
    preview: 'Der Artikel über Schlaf hat komplett verändert, wie ich über Erholung denke',
    time: 'Mo', unread: 0,
    messages: [
      { from: 'them', text: 'Der Artikel über Schlaf hat komplett verändert, wie ich über Erholung denke', time: 'Mo' },
      { from: 'me',   text: 'Welcher? Der über Schlafschulden?', time: 'Mo' },
      { from: 'them', text: 'Ja, genau der. Ich wusste nicht, dass sich Schlaf gar nicht einfach so nachholen lässt.', time: 'Mo' },
    ]
  },
];

let activeConvId = null;
let autoReplyTimers = {};

function renderConvList(filter = '') {
  const list = document.getElementById('convList');
  list.innerHTML = '';
  CONVS.filter(c => c.name.toLowerCase().includes(filter.toLowerCase())).forEach(c => {
    const el = document.createElement('div');
    el.className = 'conv-item' + (c.id === activeConvId ? ' active' : '');
    el.onclick = () => openConv(c.id);
    el.innerHTML = `
      <div style="position:relative;">
        <div class="conv-avatar" style="background:${c.grad};"></div>
        ${c.online ? '<div class="conv-online"></div>' : ''}
      </div>
      <div class="conv-info">
        <div class="conv-name">${c.name}</div>
        <div class="conv-preview">${c.preview}</div>
      </div>
      <div class="conv-meta">
        <div class="conv-time">${c.time}</div>
        ${c.unread ? `<div class="conv-unread">${c.unread}</div>` : ''}
      </div>`;
    list.appendChild(el);
  });
}

function openConv(id) {
  activeConvId = id;
  const conv = CONVS.find(c => c.id === id);
  conv.unread = 0;
  renderConvList();

  document.getElementById('chatEmpty').style.display = 'none';
  const view = document.getElementById('chatView');
  view.style.display = 'flex';

  document.getElementById('chatAvatar').style.background = conv.grad;
  document.getElementById('chatName').textContent = conv.name;
  document.getElementById('chatOnline').textContent = conv.online ? 'Gerade online' : 'Zuletzt vor Kurzem aktiv';
  document.getElementById('typingAvatar').style.background = conv.grad;

  renderMessages(conv);
  document.getElementById('chatInput').focus();
}

function renderMessages(conv) {
  const area = document.getElementById('messagesArea');
  area.innerHTML = '';

  let lastDate = '';
  conv.messages.forEach((m, i) => {
    if (m.time !== lastDate && ['Gestern', 'Mo', 'Di', 'Mi'].includes(m.time)) {
      const div = document.createElement('div');
      div.className = 'msg-date-divider';
      div.textContent = m.time;
      area.appendChild(div);
      lastDate = m.time;
    }

    const isMe = m.from === 'me';
    const nextSame = conv.messages[i + 1]?.from === m.from;
    const row = document.createElement('div');
    row.className = 'msg-row' + (isMe ? ' mine' : '');

    const avatarHtml = !isMe
      ? `<div class="msg-avatar-sm${nextSame ? ' hidden' : ''}" style="background:${CONVS.find(c=>c.id===activeConvId).grad};"></div>`
      : '';

    row.innerHTML = `
      ${avatarHtml}
      <div>
        <div class="msg-bubble">${m.text}</div>
        ${!nextSame || i === conv.messages.length - 1 ? `<div class="msg-time">${isMe ? m.time : ''}</div>` : ''}
      </div>`;
    area.appendChild(row);
  });

  area.scrollTop = area.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !activeConvId) return;

  const conv = CONVS.find(c => c.id === activeConvId);
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  conv.messages.push({ from: 'me', text, time: timeStr });
  conv.preview = text;
  conv.time = 'jetzt';
  input.value = '';
  input.style.height = '';
  renderMessages(conv);
  renderConvList();

  // auto-reply after delay
  if (conv.online) {
    clearTimeout(autoReplyTimers[conv.id]);
    showTyping(true);
    autoReplyTimers[conv.id] = setTimeout(() => {
      showTyping(false);
      const replies = [
        'Das ergibt total Sinn.',
        'Danke, dass du das mit mir teilst.',
        'Ich habe in letzter Zeit über etwas Ähnliches nachgedacht.',
        'Wie lange fühlst du dich schon so?',
        'Das ist eine wirklich hilfreiche Perspektive, danke dir.',
      ];
      const reply = replies[Math.floor(Math.random() * replies.length)];
      conv.messages.push({ from: 'them', text: reply, time: timeStr });
      conv.preview = reply;
      renderMessages(conv);
      renderConvList();
    }, 1800 + Math.random() * 1200);
  }
}

function showTyping(show) {
  document.getElementById('typingIndicator').style.display = show ? 'flex' : 'none';
  if (show) document.getElementById('messagesArea').scrollTop = 99999;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function filterConvs(val) { renderConvList(val); }

function openNewMsg() {
  const name = prompt('Wem möchtest du schreiben? (Name eingeben)');
  if (!name) return;
  alert(`In einer echten App würdest du hier nach „${name}“ suchen.`);
}

renderConvList();
</script>
</body>
</html>
